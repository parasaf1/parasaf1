<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="t d"><title id="t">Engineering console</title><desc id="d">Animated typing introduction. Static content: product builder, software engineer; AI systems, full-stack products and automation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1527"/><stop offset="1" stop-color="#221a42"/></linearGradient><linearGradient id="neon"><stop stop-color="#61e2ef"/><stop offset="1" stop-color="#c4a5ff"/></linearGradient></defs><rect width="960" height="220" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="958" height="218" rx="17" fill="none" stroke="#53447d"/><path d="M25 1H935" stroke="url(#neon)" stroke-width="2"/><defs><clipPath id="typing"><rect class="type-mask" x="32" y="65" width="896" height="32"/></clipPath></defs><style>
