name: Refresh profile assets
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - '.github/workflows/profile-activity.yml'
      - 'scripts/render_activity.py'
      - 'scripts/render_public_panels.py'
permissions:
  contents: write
concurrency:
  group: public-profile-assets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Generate and publish public-only profile assets
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$RUNNER_TEMP/profile" -- --depth 1 --branch "$PROFILE_BRANCH"
          cd "$RUNNER_TEMP/profile"
          python3 scripts/render_activity.py
          python3 scripts/render_public_panels.py
          git add -- assets/activity.svg assets/project-signals.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile assets'
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:refs/heads/$PROFILE_BRANCH"
