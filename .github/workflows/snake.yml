name: Refresh contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '33 6 * * *'
  push:
    paths:
      - '.github/workflows/snake.yml'
permissions:
  contents: write
concurrency:
  group: public-profile-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: parasaf1
          github_token: ${{ github.token }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=%23c4a5ff&color_dots=%2329263e,%234b347d,%237654bd,%23a38af6,%2361e2ef
      - name: Publish generated snake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/github-snake.svg assets/github-snake.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution snake'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
